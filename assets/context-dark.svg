<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="896" height="148" viewBox="0 0 896 148" role="img" aria-labelledby="title">
  <title id="title">Now, before, and also</title>
  <style>
    .bg { fill: #0d1117; }
    .card { fill: #161b22; }
    .tick { fill: #e8b86d; }
    .label {
      fill: #e8b86d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 600;
      letter-spacing: 0.16em;
    }
    .body {
      fill: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
    .muted {
      fill: #8b949e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
    .col { animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .c2 { animation-delay: 0.12s; }
    .c3 { animation-delay: 0.24s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .col { animation: none !important; }
    }
  </style>

  <rect class="bg" width="896" height="148"/>
  <rect class="card" x="0" y="0" width="896" height="148" rx="12"/>

  <g class="col c1">
    <rect class="tick" x="28" y="28" width="16" height="2" rx="1"/>
    <text class="label" x="28" y="52" font-size="11">Now</text>
    <text class="body" x="28" y="80" font-size="15">Fullstack Founding Engineer</text>
    <text class="muted" x="28" y="102" font-size="13">Building tech at Boldfit</text>
    <text class="muted" x="28" y="120" font-size="13">from the ground up.</text>
  </g>

  <line x1="308" y1="24" x2="308" y2="124" stroke="#21262d" stroke-width="1"/>

  <g class="col c2">
    <rect class="tick" x="332" y="28" width="16" height="2" rx="1"/>
    <text class="label" x="332" y="52" font-size="11">Before</text>
    <text class="body" x="332" y="80" font-size="15">SDE II Licious &#183; 70K orders/day</text>
    <text class="muted" x="332" y="102" font-size="13">Lenskart POS, 2000+ stores</text>
    <text class="muted" x="332" y="120" font-size="13">Product Engineer, threedots</text>
  </g>

  <line x1="604" y1="24" x2="604" y2="124" stroke="#21262d" stroke-width="1"/>

  <g class="col c3">
    <rect class="tick" x="628" y="28" width="16" height="2" rx="1"/>
    <text class="label" x="628" y="52" font-size="11">Also</text>
    <text class="body" x="628" y="80" font-size="15">SIH 2020 National Finalist</text>
    <text class="muted" x="628" y="102" font-size="13">Patent: Epilexa seizure detection</text>
    <text class="muted" x="628" y="120" font-size="13">Paper: 5G slicing for drones</text>
  </g>
</svg>
