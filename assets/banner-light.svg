  <title id="title">Rishiraj Singh Chhabra</title>
  <desc id="desc">Fullstack Founding Engineer at Boldfit. Building the tech foundation from the ground up.</desc>
  <style>
    .bg { fill: #ffffff; }
    .surface { fill: #f6f8fa; }
    .accent { fill: #b45309; }
    .mint { fill: #1a7f4b; }
    .text {
      fill: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .muted {
      fill: #656d76;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0;
    }
    .label {
      fill: #b45309;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .cell { fill: #d0d7de; }
    .cell-l { fill: #e8d4b8; }
    .cell-m { fill: #d4a574; }
    .cell-h { fill: #b45309; }
    .cell-a { fill: #1a7f4b; }
    .ln { animation: rise 1.2s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .ln2 { animation-delay: 0.1s; }
    .ln3 { animation-delay: 0.2s; }
    .ln4 { animation-delay: 0.32s; }
    .ln5 { animation-delay: 0.44s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .bar {
      animation: wave 1.55s ease-in-out infinite;
      transform-origin: 0 0;
    }
    .b2 { animation-delay: 0.12s; }
    .b3 { animation-delay: 0.24s; }
    .b4 { animation-delay: 0.08s; }
    .b5 { animation-delay: 0.32s; }
    .b6 { animation-delay: 0.18s; }
    .b7 { animation-delay: 0.4s; }
    .b8 { animation-delay: 0.28s; }
    @keyframes wave {
      0%, 100% { transform: scaleY(0.38); }
      50% { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ln, .bar { animation: none !important; }
    }
  </style>

